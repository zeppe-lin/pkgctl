format: zeppe-lin.recipe/1

package:
  name: tool
  version: 1.0
  release: 1
  summary: native construction dependent fixture
  licenses:
    - GPL-3.0-or-later

requirements:
  build:
    - package: dep

sources:
  - path: files/source.txt
    name: source.txt
    sha256: 42d26b2e82cf8ed42651ab63ec29927658d2e15f91c72d3ffd72a3755eb1f66f

build:
  language: posix-shell
  script: |
    [ "$PKG_JOBS" = 3 ]
    [ "$SOURCE_DATE_EPOCH" = 123456789 ]
    [ "$(umask)" = 0022 ]
    IFS= read -r source <"$PKG_SOURCE_ROOT/source.txt"
    IFS= read -r recorded_dependency <"$PKG_BUILD_INPUT_ROOT/dep/dep-token"
    dependency=$("$PKG_BUILD_INPUT_ROOT/dep/dep-tool")
    [ "$source" = tool-source ]
    [ "$recorded_dependency" = dependency-source ]
    [ "$dependency" = "$recorded_dependency" ]
    printf '%s+%s\n' "$source" "$dependency" >"$PKG_DESTDIR/tool-token"
    {
      printf 'parallelism=%s\n' "$PKG_JOBS"
      printf 'source-date-epoch=%s\n' "$SOURCE_DATE_EPOCH"
      printf 'umask=%s\n' "$(umask)"
    } >"$PKG_DESTDIR/build-policy"

check:
  language: posix-shell
  script: |
    [ "$PKG_JOBS" = 3 ]
    [ "$SOURCE_DATE_EPOCH" = 123456789 ]
    [ "$(umask)" = 0022 ]
    IFS= read -r source <"$PKG_SOURCE_ROOT/source.txt"
    IFS= read -r payload <"$PKG_PACKAGE_ROOT/tool-token"
    [ "$source" = tool-source ]
    [ "$payload" = tool-source+dependency-source ]
    printf 'checked:%s\n' "$payload" > /tmp/check-ran

architectures:
  build:
    - x86_64
  target:
    - x86_64
