format: zeppe-lin.recipe/1
package:
  name: cohort-filesystem
  version: 1.0
  release: 1
  summary: runtime cohort filesystem fixture
  licenses: [GPL-3.0-or-later]
requirements: {}
sources: []
build:
  language: posix-shell
  script: |
    set -eu
    mkdir -p "$PKG_DESTDIR/usr/lib"
    ln -s lib "$PKG_DESTDIR/usr/lib64"
    ln -s usr/lib64 "$PKG_DESTDIR/lib64"
architectures:
  build: [x86_64]
  target: [x86_64]
