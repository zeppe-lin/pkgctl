format: zeppe-lin.recipe/1

package:
  name: runtime-lib-hostile
  version: 1.0
  release: 1
  summary: incompatible shared ownership image fixture
  licenses:
    - GPL-3.0-or-later

requirements:
  {}

sources:
  - path: files/source.txt
    name: source.txt
    sha256: f9cc7b9d0fa146f4d027c5f96e92b2bfb911512d3f86238da04414db18fad41f

build:
  language: posix-shell
  script: |
    IFS= read -r source <"$PKG_SOURCE_ROOT/source.txt"
    [ "$source" = runtime-lib-hostile-source ] || exit 1
    printf '%s\n' "$source" >"$PKG_DESTDIR/runtime-lib-hostile-marker" || exit 1
    mkdir -p "$PKG_DESTDIR/usr/lib" || exit 1
    printf '%s\n' hostile-authority >"$PKG_DESTDIR/usr/lib/shared-ownership-marker" || exit 1

architectures:
  build:
    - x86_64
  target:
    - x86_64
