format: zeppe-lin.recipe/1

package:
  name: fixture
  version: 1.0
  release: 1
  summary: native CLI post-install lease-loss fixture
  licenses:
    - GPL-3.0-or-later

requirements:
  {}

sources: []

build:
  language: posix-shell
  script: |
    mkdir -p "$PKG_DESTDIR/usr/bin"
    printf 'pkgctl integration fixture\n' >"$PKG_DESTDIR/usr/bin/pkgctl-fixture"
    chmod 0755 "$PKG_DESTDIR/usr/bin/pkgctl-fixture"

lifecycle:
  post-install:
    language: posix-shell
    script: |
      # pkgctl-test-lease-loss-lifecycle
      printf 'post-install ran\n' >"$ZEPPE_LIN_TARGET_ROOT/post-install-ran"
      printf 'ready\n' >"$ZEPPE_LIN_TARGET_ROOT/.pkgctl-test-lease-loss-ready"
      IFS= read -r acknowledgement <"$ZEPPE_LIN_TARGET_ROOT/.pkgctl-test-lease-loss-ack"
      [ "$acknowledgement" = revoked ]

architectures:
  build:
    - x86_64
  target:
    - x86_64
